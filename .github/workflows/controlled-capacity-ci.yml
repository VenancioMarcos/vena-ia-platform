name: Controlled Capacity CI

on:
  pull_request:
    paths:
      - "capacity-profile.json"
      - "scripts/capacity_*.py"
      - "tests/operations/test_controlled_capacity.py"
      - "apps/api/tests/test_mvp_e2e.py"
      - ".github/workflows/controlled-capacity-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
        env:
          POSTGRES_DB: vena_ia_test
          POSTGRES_USER: vena_ia
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vena_ia -d vena_ia_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vena_ia:test-only-password@localhost:5432/vena_ia_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
      AUTH_SECURITY_STORE: memory
      JOBS_QUEUE_PROVIDER: memory
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/api/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==26.1.2
          pip install -e .
          pip install -e "apps/api[dev]"
      - name: Validate capacity profile
        run: python scripts/capacity_policy.py
      - name: Run controlled load and short soak tests
        run: python -m pytest tests/operations/test_controlled_capacity.py
      - name: Run authenticated E2E and isolation
        working-directory: apps/api
        run: pytest tests/test_mvp_e2e.py
      - name: Generate bounded evidence outside repository
        run: python scripts/capacity_harness.py --output ../capacity-evidence.json --commit "$GITHUB_SHA"
      - name: Upload safe evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: controlled-capacity-evidence
          path: ../capacity-evidence.json
          if-no-files-found: error
          retention-days: 7
