name: Backend CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/ai/**"
      - "packages/__init__.py"
      - "scripts/**"
      - "tests/operations/**"
      - "pyproject.toml"
      - ".python-version"
      - "runtime-policy.json"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/ai/**"
      - "packages/__init__.py"
      - "scripts/**"
      - "tests/operations/**"
      - "pyproject.toml"
      - ".python-version"
      - "runtime-policy.json"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
        env:
          POSTGRES_DB: vena_ia_test
          POSTGRES_USER: vena_ia
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vena_ia -d vena_ia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vena_ia:test-only-password@localhost:5432/vena_ia_test
      REDIS_URL: redis://localhost:6379/0
      RUN_REDIS_INTEGRATION: "1"
      RUN_POSTGRES_BACKUP_INTEGRATION: "1"
      POSTGRES_DB: vena_ia_test
      POSTGRES_USER: vena_ia
      POSTGRES_PASSWORD: test-only-password
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: test-minio-access
      MINIO_SECRET_KEY: test-minio-secret
      MINIO_BUCKET: vena-ia-files-test
      RUN_MINIO_BACKUP_INTEGRATION: "1"
      RUN_READINESS_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==26.1.2
          pip install -e .
          pip install -e "apps/api[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check API, AI Layer and operational scripts
        run: mypy apps/api/app packages/ai scripts

      - name: Validate PostgreSQL migrations
        working-directory: apps/api
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Test
        working-directory: apps/api
        run: pytest

      - name: Locate PostgreSQL service container
        run: echo "POSTGRES_CONTAINER_ID=$(docker ps --filter ancestor=pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21 --format '{{.ID}}' | head -n 1)" >> "$GITHUB_ENV"

      - name: Start disposable MinIO service
        run: |
          docker run --detach --name vena-minio-ci --publish 9000:9000 \
            --env MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs vena-minio-ci
          exit 1

      - name: Test PostgreSQL and MinIO backup and restore
        run: python -m pytest -s tests/operations
