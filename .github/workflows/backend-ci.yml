name: Backend CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/ai/**"
      - "packages/__init__.py"
      - "scripts/**"
      - "tests/operations/**"
      - "pyproject.toml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/ai/**"
      - "packages/__init__.py"
      - "scripts/**"
      - "tests/operations/**"
      - "pyproject.toml"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: vena_ia_test
          POSTGRES_USER: vena_ia
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vena_ia -d vena_ia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vena_ia:test-only-password@localhost:5432/vena_ia_test
      REDIS_URL: redis://localhost:6379/0
      RUN_REDIS_INTEGRATION: "1"
      RUN_POSTGRES_BACKUP_INTEGRATION: "1"
      POSTGRES_DB: vena_ia_test
      POSTGRES_USER: vena_ia
      POSTGRES_PASSWORD: test-only-password
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: test-minio-access
      MINIO_SECRET_KEY: test-minio-secret
      RUN_MINIO_BACKUP_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e "apps/api[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check API and AI Layer
        run: mypy apps/api/app packages/ai

      - name: Validate PostgreSQL migrations
        working-directory: apps/api
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Test
        working-directory: apps/api
        run: pytest

      - name: Locate PostgreSQL service container
        run: echo "POSTGRES_CONTAINER_ID=$(docker ps --filter ancestor=pgvector/pgvector:pg17 --format '{{.ID}}' | head -n 1)" >> "$GITHUB_ENV"

      - name: Start disposable MinIO service
        run: |
          docker run --detach --name vena-minio-ci --publish 9000:9000 \
            --env MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            minio/minio:latest server /data
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs vena-minio-ci
          exit 1

      - name: Test PostgreSQL and MinIO backup and restore
        run: python -m pytest tests/operations
