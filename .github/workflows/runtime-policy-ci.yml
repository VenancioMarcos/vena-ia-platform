name: Runtime Policy CI

on:
  pull_request:
    paths:
      - "apps/api/Dockerfile"
      - "apps/web/Dockerfile"
      - "apps/web/package.json"
      - "apps/web/pnpm-lock.yaml"
      - "docker-compose.yml"
      - "runtime-policy.json"
      - ".python-version"
      - ".node-version"
      - "scripts/runtime_policy.py"
      - "tests/operations/test_runtime_policy.py"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "apps/api/Dockerfile"
      - "apps/web/Dockerfile"
      - "apps/web/package.json"
      - "apps/web/pnpm-lock.yaml"
      - "docker-compose.yml"
      - "runtime-policy.json"
      - ".python-version"
      - ".node-version"
      - "scripts/runtime_policy.py"
      - "tests/operations/test_runtime_policy.py"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  policy-and-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.11"

      - name: Validate runtime policy
        run: python scripts/runtime_policy.py

      - name: Validate Compose
        run: docker compose config --no-env-resolution --quiet

      - name: Build pinned API and Web images
        run: |
          docker build --file apps/api/Dockerfile --tag vena-ia-api:runtime-policy .
          docker build --file apps/web/Dockerfile --tag vena-ia-web:runtime-policy apps/web
